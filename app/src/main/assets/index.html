<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ScreenMate AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-card: rgba(17, 24, 39, 0.96);
            --border-card: rgba(255, 255, 255, 0.12);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --card-sub: #1f2937;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: transparent !important;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* OVERLAY BACKDROP: Ketuk di luar untuk menutup */
        .overlay-backdrop {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 12px;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* FLOATING CARD CONTAINER (BOTTOM SHEET / FLOATING) */
        .panel-card {
            width: 100%;
            max-width: 420px;
            max-height: 88vh;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(40px) scale(0.96); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* HEADER */
        .card-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-card);
            background: rgba(15, 23, 42, 0.85);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1rem;
            color: #fff;
        }

        .brand-badge {
            font-size: 0.65rem;
            background: rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-sub);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .btn-icon:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-close:hover {
            color: #fff;
            background: var(--danger);
        }

        /* BODY */
        .card-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* MODE SELECTION */
        .modes-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .modes-scroll::-webkit-scrollbar { display: none; }

        .mode-chip {
            background: var(--card-sub);
            border: 1px solid var(--border-card);
            color: var(--text-sub);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mode-chip.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        /* MAIN ACTION BUTTON: ANALISIS LAYAR LANGSUNG */
        .btn-scan-screen {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            color: #fff;
            border: none;
            padding: 14px 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
            transition: all 0.2s;
        }
        .btn-scan-screen:active {
            transform: scale(0.97);
        }

        .btn-auto-click {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            padding: 13px 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
            animation: pulseGreen 1.5s infinite;
        }
        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* PREVIEW IMAGE */
        .preview-box {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-card);
            display: none;
            max-height: 120px;
            background: #000;
        }
        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .btn-remove-preview {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 13px;
        }

        /* LOADING INDICATOR */
        .loading-state {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 14px;
            font-size: 0.85rem;
            color: #c7d2fe;
            font-weight: 600;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(99, 102, 241, 0.3);
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* RESULT SECTION */
        .result-wrapper {
            background: var(--card-sub);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-sub);
            font-weight: 700;
        }

        .result-content {
            font-size: 0.88rem;
            line-height: 1.6;
            color: #f3f4f6;
            white-space: pre-wrap;
            max-height: 220px;
            overflow-y: auto;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-card);
            color: var(--text-sub);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* SETTINGS MODAL / CONFIG CARD */
        .settings-box {
            display: none;
            background: #111827;
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 14px;
            padding: 14px;
            flex-direction: column;
            gap: 10px;
        }

        .settings-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #a5b4fc;
        }

        .input-text {
            width: 100%;
            background: #1f2937;
            border: 1px solid var(--border-card);
            color: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.82rem;
            outline: none;
        }
        .input-text:focus {
            border-color: var(--primary);
        }

        /* FOOTER ACTIONS */
        .card-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-card);
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.7);
        }

        .btn-hide-panel {
            flex: 1;
            background: #374151;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-stop-service {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- OVERLAY BACKDROP (KETUK DI LUAR KARTU AKAN MENUTUP PANEL) -->
    <div class="overlay-backdrop" id="overlayBackdrop">
        <div class="panel-card" id="panelCard">
            <!-- HEADER -->
            <div class="card-header">
                <div class="brand">
                    <span>⚡ ScreenMate AI</span>
                    <span class="brand-badge" id="modeBadge">Jawab Soal</span>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" id="btnToggleSettings" title="Pengaturan API / Server">⚙️</button>
                    <button class="btn-icon btn-close" id="btnCloseTop" title="Tutup Panel">✕</button>
                </div>
            </div>

            <!-- BODY -->
            <div class="card-body">
                <!-- SETTINGS MODAL (API KEY & SERVER) -->
                <div class="settings-box" id="settingsBox">
                    <div class="settings-title">⚙️ Konfigurasi AI &amp; Server</div>
                    <label style="font-size: 0.72rem; color: var(--text-sub);">Google Gemini API Key (aistudio.google.com):</label>
                    <input type="password" id="inputApiKey" class="input-text" placeholder="AIzaSy...">
                    <label style="font-size: 0.72rem; color: var(--text-sub);">Atau URL Server Backend PC (opsional):</label>
                    <input type="text" id="inputServerUrl" class="input-text" placeholder="http://192.168.1.10:3000">
                    <button class="btn-hide-panel" id="btnSaveSettings" style="background: var(--primary);">Simpan Pengaturan</button>
                </div>

                <!-- MODE SELECTOR -->
                <div class="modes-scroll" id="modeSelector">
                    <div class="mode-chip active" data-mode="Jawab Soal">🎯 Jawab Soal</div>
                    <div class="mode-chip" data-mode="Wordwall Assist">🎮 Wordwall Auto-Click</div>
                    <div class="mode-chip" data-mode="Google Docs">📄 Google Docs / Bacaan</div>
                    <div class="mode-chip" data-mode="Jelaskan Soal">💡 Penjelasan</div>
                    <div class="mode-chip" data-mode="Translate">🌐 Terjemah</div>
                </div>

                <!-- TOMBOL UTAMA: LANGSUNG SCAN LAYAR HP SAAT INI -->
                <button class="btn-scan-screen" id="btnScanScreen">
                    <span style="font-size: 1.2rem;">📸</span>
                    <span>ANALISIS LAYAR INI SEKARANG</span>
                </button>

                <!-- TOMBOL AUTO-CLICK JAWABAN (OTOMATIS MUNCUL JIKA TERDETEKSI KARTU WORDWALL/PILIHAN) -->
                <button class="btn-auto-click" id="btnAutoClick">
                    <span>⚡ KETUK OTOMATIS JAWABAN DI LAYAR</span>
                </button>

                <!-- PREVIEW BOX -->
                <div class="preview-box" id="previewBox">
                    <img id="previewImg" src="" alt="Screenshot">
                    <button class="btn-remove-preview" id="btnRemovePreview">✕</button>
                </div>

                <!-- LOADING SPINNER -->
                <div class="loading-state" id="loadingState">
                    <div class="spinner"></div>
                    <span id="loadingText">Menangkap &amp; menganalisis layar...</span>
                </div>

                <!-- HASIL JAWABAN -->
                <div class="result-wrapper">
                    <div class="result-header">
                        <span>Hasil Analisis AI</span>
                        <button class="btn-copy" id="btnCopyResult">Copy</button>
                    </div>
                    <div class="result-content" id="resultContent">Buka soal/game di HP Anda, lalu klik tombol <b>"ANALISIS LAYAR INI SEKARANG"</b> di atas.</div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="card-footer">
                <button class="btn-hide-panel" id="btnCloseBottom">Sembunyikan Panel</button>
                <button class="btn-stop-service" id="btnStopApp" title="Matikan Floating Bubble">Matikan Bubble</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT CLIENT -->
    <script>
        let currentMode = 'Jawab Soal';
        let detectedCoords = null;
        let currentBase64 = null;

        const backdrop = document.getElementById('overlayBackdrop');
        const btnCloseTop = document.getElementById('btnCloseTop');
        const btnCloseBottom = document.getElementById('btnCloseBottom');
        const btnStopApp = document.getElementById('btnStopApp');
        const btnScanScreen = document.getElementById('btnScanScreen');
        const btnAutoClick = document.getElementById('btnAutoClick');
        const previewBox = document.getElementById('previewBox');
        const previewImg = document.getElementById('previewImg');
        const btnRemovePreview = document.getElementById('btnRemovePreview');
        const loadingState = document.getElementById('loadingState');
        const resultContent = document.getElementById('resultContent');
        const btnCopyResult = document.getElementById('btnCopyResult');
        const modeBadge = document.getElementById('modeBadge');
        
        // Settings elements
        const btnToggleSettings = document.getElementById('btnToggleSettings');
        const settingsBox = document.getElementById('settingsBox');
        const inputApiKey = document.getElementById('inputApiKey');
        const inputServerUrl = document.getElementById('inputServerUrl');
        const btnSaveSettings = document.getElementById('btnSaveSettings');

        // Load saved settings
        inputApiKey.value = localStorage.getItem('gemini_api_key') || '';
        inputServerUrl.value = localStorage.getItem('server_backend_url') || '';

        btnToggleSettings.addEventListener('click', () => {
            settingsBox.style.display = settingsBox.style.display === 'flex' ? 'none' : 'flex';
        });

        btnSaveSettings.addEventListener('click', () => {
            localStorage.setItem('gemini_api_key', inputApiKey.value.trim());
            localStorage.setItem('server_backend_url', inputServerUrl.value.trim());
            settingsBox.style.display = 'none';
            alert('Pengaturan berhasil disimpan!');
        });

        // Mode Selector Chips
        document.querySelectorAll('.mode-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentMode = chip.getAttribute('data-mode');
                modeBadge.innerText = currentMode;
                btnAutoClick.style.display = 'none';
            });
        });

        // Tutup Panel Overlay
        function closePanel() {
            if (window.Android && window.Android.closePanel) {
                window.Android.closePanel();
            } else {
                document.body.style.display = 'none';
            }
        }

        backdrop.addEventListener('click', (e) => {
            if (e.target === backdrop) closePanel();
        });
        btnCloseTop.addEventListener('click', closePanel);
        btnCloseBottom.addEventListener('click', closePanel);

        // Hentikan Service
        btnStopApp.addEventListener('click', () => {
            if (confirm("Matikan floating bubble ScreenMate AI?")) {
                if (window.Android && window.Android.exitApp) {
                    window.Android.exitApp();
                } else {
                    closePanel();
                }
            }
        });

        // 1. TEKAN TOMBOL ANALISIS LAYAR SEKARANG
        btnScanScreen.addEventListener('click', () => {
            btnAutoClick.style.display = 'none';
            showLoading("Menangkap layar HP Anda...");

            if (window.Android && window.Android.captureScreenNow) {
                // Panggil fungsi native Android untuk tangkap layar tanpa dialog
                window.Android.captureScreenNow(currentMode);
            } else {
                hideLoading();
                alert("Jalankan di aplikasi Android ScreenMate AI.");
            }
        });

        // 2. CALLBACK DARI ANDROID SAAT SCREENSHOT BERHASIL DIAMBIL
        window.onScreenCaptured = function(base64Image, mode) {
            currentBase64 = base64Image;
            previewImg.src = "data:image/jpeg;base64," + base64Image;
            previewBox.style.display = 'block';
            processAIAnalysis(base64Image, mode);
        };

        // 3. CALLBACK JIKA GAGAL TANGKAP LAYAR
        window.onCaptureError = function(errorMsg) {
            hideLoading();
            resultContent.innerHTML = `<span style="color:#ef4444;">⚠️ [Gagal Tangkap Layar]:</span> ${errorMsg}<br><br><small style="color:#9ca3af;">Pastikan Layanan Aksesibilitas 'ScreenMate AI' sudah AKTIF di Pengaturan HP Anda.</small>`;
        };

        btnRemovePreview.addEventListener('click', () => {
            previewBox.style.display = 'none';
            previewImg.src = '';
            currentBase64 = null;
            btnAutoClick.style.display = 'none';
        });

        // 4. PROSES ANALISIS KE AI (DIRECT GEMINI API / BACKEND)
        async function processAIAnalysis(base64Image, mode) {
            showLoading(`Menganalisis soal (${mode}) dengan AI...`);
            
            const apiKey = localStorage.getItem('gemini_api_key');
            const serverUrl = localStorage.getItem('server_backend_url');

            // Susun prompt berdasarkan mode
            let systemPrompt = "";
            if (mode === 'Wordwall Assist') {
                systemPrompt = `Analisis screenshot game kuis Wordwall ini secara teliti.
1. Baca soal yang tertulis di bagian atas layar.
2. Cari kartu pilihan jawaban yang BENAR.
3. Tentukan koordinat titik tengah kartu yang benar dalam skala 0 sampai 1000:
   - centerX: posisi horizontal (0 = paling kiri, 1000 = paling kanan)
   - centerY: posisi vertikal (0 = paling atas, 1000 = paling bawah)
4. Kembalikan HANYA format JSON murni tanpa markdown:
{"question":"soal","answer":"jawaban benar","cardColor":"warna kartu","centerX":500,"centerY":750,"explanation":"alasan"}`;
            } else if (mode === 'Google Docs') {
                systemPrompt = `Ekstrak dan analisis teks dari Google Docs / dokumen pada gambar layar ini.
1. Berikan ringkasan poin-poin utama isi dokumen.
2. Jika ada pertanyaan atau instruksi di dokumen, berikan jawabannya secara langsung dan padat.`;
            } else if (mode === 'Jelaskan Soal') {
                systemPrompt = `Jelaskan materi dan langkah demi langkah penyelesaian soal pada gambar layar ini dengan bahasa yang sangat mudah dimengerti.`;
            } else if (mode === 'Translate') {
                systemPrompt = `Terjemahkan seluruh teks pada gambar layar ini ke Bahasa Indonesia yang akurat dan natural.`;
            } else {
                // Jawab Soal
                systemPrompt = `Analisis soal pada gambar layar ini.
1. Berikan [JAWABAN TEPAT]: (sebutkan opsi A/B/C/D/E jika pilihan ganda beserta teksnya).
2. [PENJELASAN RINGKAS]: Rumus dan langkah pengerjaan singkat.
3. [TINGKAT KEYAKINAN]: 100%`;
            }

            try {
                // Jalur 1: Jika ada URL server backend
                if (serverUrl) {
                    const endpoint = mode === 'Wordwall Assist' ? `${serverUrl}/api/wordwall-assist` : `${serverUrl}/api/analyze`;
                    const blob = await (await fetch("data:image/jpeg;base64," + base64Image)).blob();
                    const fd = new FormData();
                    fd.append('screenshot', blob, 'screen.jpg');
                    fd.append('mode', mode);

                    const res = await fetch(endpoint, { method: 'POST', body: fd });
                    const d = await res.json();
                    handleAiResponse(d, mode);
                    return;
                }

                // Jalur 2: Direct Gemini API (Standar & Mandiri di HP)
                if (!apiKey) {
                    hideLoading();
                    resultContent.innerHTML = `<span style="color:#f59e0b;">🔑 Masukkan Gemini API Key:</span><br>
Klik ikon gerigi ⚙️ di pojok kanan atas, lalu masukkan Gemini API Key gratis Anda (didapatkan dari <a href="https://aistudio.google.com" target="_blank" style="color:#818cf8;">aistudio.google.com</a>) agar asisten bisa langsung menganalisis layar.`;
                    settingsBox.style.display = 'flex';
                    return;
                }

                // Panggil Gemini API (Mengutamakan gemini-3.8-flash sesuai rekomendasi resmi)
                const candidateModels = [
                    'gemini-3.8-flash',
                    'gemini-3-flash-preview',
                    'gemini-2.5-flash',
                    'gemini-1.5-flash'
                ];

                const bodyPayload = {
                    contents: [{
                        parts: [
                            { inline_data: { mime_type: "image/jpeg", data: base64Image } },
                            { text: systemPrompt }
                        ]
                    }]
                };

                let responseData = null;
                let lastErrMsg = '';

                for (const model of candidateModels) {
                    try {
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                        const res = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(bodyPayload)
                        });

                        if (res.ok) {
                            responseData = await res.json();
                            break;
                        } else {
                            const errJson = await res.json();
                            lastErrMsg = errJson.error ? errJson.error.message : `HTTP ${res.status}`;
                        }
                    } catch (e) {
                        lastErrMsg = e.message;
                    }
                }

                if (!responseData) {
                    throw new Error(lastErrMsg || 'Gagal menghubungi server Gemini AI.');
                }

                const rawText = responseData.candidates?.[0]?.content?.parts?.[0]?.text || "Tidak ada respon dari AI.";
                handleAiResponse({ analysis: rawText }, mode);

            } catch (err) {
                hideLoading();
                resultContent.innerHTML = `<span style="color:#ef4444;">❌ [Error Analisis]:</span> ${err.message}<br><br><small style="color:#9ca3af;">Periksa API Key di tombol ⚙️ atau pastikan koneksi internet aktif.</small>`;
            }
        }

        function handleAiResponse(data, mode) {
            hideLoading();
            let text = data.analysis || "";

            if (mode === 'Wordwall Assist') {
                try {
                    let clean = text.replace(/```json/gi, '').replace(/```/g, '').trim();
                    let parsed = data.centerX ? data : JSON.parse(clean);
                    
                    if (parsed.centerX && parsed.centerY) {
                        detectedCoords = {
                            x: parsed.centerX / 1000,
                            y: parsed.centerY / 1000
                        };
                        btnAutoClick.style.display = 'flex';
                        btnAutoClick.innerHTML = `⚡ KETUK OTOMATIS: ${parsed.answer || 'Kartu Benar'}`;
                    }

                    resultContent.innerHTML = `🎯 <b>Jawaban:</b> ${parsed.answer || 'Terdeteksi'}<br>
🎨 <b>Warna Kartu:</b> ${parsed.cardColor || '-'}<br>
💡 <b>Alasan:</b> ${parsed.explanation || '-'}`;
                    return;
                } catch(e) {
                    // Fallback jika tidak JSON murni
                }
            }

            // Format jawaban biasa
            resultContent.innerHTML = formatText(text);
        }

        // 5. EKSEKUSI AUTO-CLICK
        btnAutoClick.addEventListener('click', () => {
            if (detectedCoords && window.Android && window.Android.performAutoClick) {
                window.Android.performAutoClick(detectedCoords.x, detectedCoords.y);
            }
        });

        function formatText(str) {
            if (!str) return 'Tidak ada data.';
            return str
                .replace(/\*\*([^*]+)\*\*/g, '<strong style="color:#818cf8;">$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function showLoading(msg) {
            loadingState.style.display = 'flex';
            document.getElementById('loadingText').innerText = msg;
        }

        function hideLoading() {
            loadingState.style.display = 'none';
        }

        btnCopyResult.addEventListener('click', () => {
            navigator.clipboard.writeText(resultContent.innerText);
            btnCopyResult.innerText = 'Tersalin!';
            setTimeout(() => btnCopyResult.innerText = 'Copy', 1500);
        });
    </script>
</body>
</html>
