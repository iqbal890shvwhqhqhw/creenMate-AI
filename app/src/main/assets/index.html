<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ScreenMate AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-card: rgba(22, 27, 34, 0.96);
            --border-card: rgba(255, 255, 255, 0.12);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --card-sub: #1f2937;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: transparent !important;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* BACKDROP: Ketuk area luar untuk menutup */
        .overlay-backdrop {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* FLOATING CARD CONTAINER */
        .panel-card {
            width: 100%;
            max-width: 380px;
            max-height: 85vh;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(30px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* HEADER */
        .card-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-card);
            background: rgba(15, 20, 28, 0.8);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
        }

        .brand-badge {
            font-size: 0.68rem;
            background: rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-sub);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
        }
        .btn-icon:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-close-danger:hover {
            color: #fff;
            background: var(--danger);
        }

        /* BODY */
        .card-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* MODE SELECTION */
        .modes-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .modes-scroll::-webkit-scrollbar { display: none; }

        .mode-chip {
            background: var(--card-sub);
            border: 1px solid var(--border-card);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .mode-chip.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* ACTION BUTTONS */
        .action-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-sub {
            background: var(--card-sub);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* PREVIEW IMAGE */
        .preview-box {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-card);
            display: none;
            max-height: 140px;
        }
        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .btn-remove-preview {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 13px;
        }

        /* LOADING INDICATOR */
        .loading-state {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 12px;
            font-size: 0.8rem;
            color: #a5b4fc;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* RESULT SECTION */
        .result-wrapper {
            background: var(--card-sub);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-sub);
            font-weight: 700;
        }

        .result-content {
            font-size: 0.84rem;
            line-height: 1.5;
            color: #e5e7eb;
            white-space: pre-wrap;
            max-height: 180px;
            overflow-y: auto;
        }

        .btn-copy {
            background: transparent;
            border: 1px solid var(--border-card);
            color: var(--text-sub);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            cursor: pointer;
        }

        /* FOOTER ACTIONS */
        .card-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-card);
            display: flex;
            gap: 8px;
            background: rgba(15, 20, 28, 0.6);
        }

        .btn-close-panel {
            flex: 1;
            background: #374151;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-stop-service {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <!-- OVERLAY BACKDROP (KLIK DI LUAR CARD AKAN MENUTUP PANEL) -->
    <div class="overlay-backdrop" id="overlayBackdrop">
        <div class="panel-card" id="panelCard">
            <!-- HEADER -->
            <div class="card-header">
                <div class="brand">
                    <span>⚡ ScreenMate AI</span>
                    <span class="brand-badge">Mobile</span>
                </div>
                <div class="header-actions">
                    <button class="btn-icon btn-close-danger" id="btnCloseTop" title="Tutup Panel">✕</button>
                </div>
            </div>

            <!-- BODY -->
            <div class="card-body">
                <!-- MODE SELECTOR -->
                <div class="modes-scroll" id="modeSelector">
                    <div class="mode-chip active" data-mode="Jawab Soal">🎯 Jawab Soal</div>
                    <div class="mode-chip" data-mode="Jelaskan Soal">💡 Penjelasan</div>
                    <div class="mode-chip" data-mode="Ringkas">📝 Ringkas</div>
                    <div class="mode-chip" data-mode="Translate">🌐 Terjemah</div>
                    <div class="mode-chip" data-mode="Wordwall Assist">🎮 Wordwall</div>
                </div>

                <!-- PREVIEW BOX -->
                <div class="preview-box" id="previewBox">
                    <img id="previewImg" src="" alt="Screenshot">
                    <button class="btn-remove-preview" id="btnRemovePreview">✕</button>
                </div>

                <!-- ACTIONS -->
                <div class="action-grid">
                    <button class="btn-primary" id="btnUploadImage">
                        <span>📁 Pilih Gambar Soal / Screenshot</span>
                    </button>
                    <button class="btn-sub" id="btnAutoClick" style="display:none; background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.3);">
                        <span>⚡ Ketuk Otomatis Jawaban di Layar</span>
                    </button>
                </div>

                <input type="file" id="fileInput" accept="image/*">

                <!-- LOADING SPINNER -->
                <div class="loading-state" id="loadingState">
                    <div class="spinner"></div>
                    <span id="loadingText">Menganalisis soal dengan Gemini AI...</span>
                </div>

                <!-- RESULT SECTION -->
                <div class="result-wrapper">
                    <div class="result-header">
                        <span>Hasil Jawaban</span>
                        <button class="btn-copy" id="btnCopyResult">Copy</button>
                    </div>
                    <div class="result-content" id="resultContent">Pilih gambar screenshot soal untuk melihat jawaban otomatis di sini.</div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="card-footer">
                <button class="btn-close-panel" id="btnCloseBottom">Sembunyikan Panel</button>
                <button class="btn-stop-service" id="btnStopApp" title="Matikan Floating Bubble">Matikan Bubble</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT CLIENT -->
    <script>
        let currentMode = 'Jawab Soal';
        let detectedCoordinates = null;

        const backdrop = document.getElementById('overlayBackdrop');
        const card = document.getElementById('panelCard');
        const btnCloseTop = document.getElementById('btnCloseTop');
        const btnCloseBottom = document.getElementById('btnCloseBottom');
        const btnStopApp = document.getElementById('btnStopApp');
        const btnUploadImage = document.getElementById('btnUploadImage');
        const btnAutoClick = document.getElementById('btnAutoClick');
        const fileInput = document.getElementById('fileInput');
        const previewBox = document.getElementById('previewBox');
        const previewImg = document.getElementById('previewImg');
        const btnRemovePreview = document.getElementById('btnRemovePreview');
        const loadingState = document.getElementById('loadingState');
        const resultContent = document.getElementById('resultContent');
        const btnCopyResult = document.getElementById('btnCopyResult');

        // Fungsi Menutup Panel Overlay
        function closeOverlay() {
            if (window.Android && window.Android.closePanel) {
                window.Android.closePanel();
            } else {
                document.body.style.display = 'none';
            }
        }

        // Matikan Service Bubble sepenuhnya
        function exitBubbleService() {
            if (confirm("Matikan floating bubble ScreenMate AI?")) {
                if (window.Android && window.Android.exitApp) {
                    window.Android.exitApp();
                } else {
                    closeOverlay();
                }
            }
        }

        // Tutup saat klik di luar kartu (backdrop)
        backdrop.addEventListener('click', (e) => {
            if (e.target === backdrop) {
                closeOverlay();
            }
        });

        btnCloseTop.addEventListener('click', closeOverlay);
        btnCloseBottom.addEventListener('click', closeOverlay);
        btnStopApp.addEventListener('click', exitBubbleService);

        // Mode Selector Chips
        document.querySelectorAll('.mode-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentMode = chip.getAttribute('data-mode');
            });
        });

        // Trigger Pilih File
        btnUploadImage.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleImageSelected(e.target.files[0]);
            }
        });

        function handleImageSelected(file) {
            previewImg.src = URL.createObjectURL(file);
            previewBox.style.display = 'block';
            analyzeImage(file);
        }

        btnRemovePreview.addEventListener('click', () => {
            previewBox.style.display = 'none';
            previewImg.src = '';
            fileInput.value = '';
            btnAutoClick.style.display = 'none';
        });

        async function analyzeImage(blob) {
            showLoading(`Menganalisis soal (${currentMode})...`);
            
            const formData = new FormData();
            formData.append('screenshot', blob, 'screenshot.png');
            formData.append('mode', currentMode);

            try {
                // Koneksi ke server lokal backend jika aktif
                const res = await fetch('http://localhost:3000/api/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                
                resultContent.innerHTML = formatAnalysis(data.analysis || 'Jawaban ditemukan.');
                
                if (data.clickX && data.clickY) {
                    detectedCoordinates = { x: data.clickX, y: data.clickY };
                    btnAutoClick.style.display = 'flex';
                }
            } catch (err) {
                resultContent.innerHTML = `<span style="color:#ef4444;">[Info Server]:</span> ${err.message}<br><small style="color:#9ca3af;">Pastikan server backend berjalan di port 3000, atau gunakan koneksi Wi-Fi yang sama dengan PC.</small>`;
            } finally {
                hideLoading();
            }
        }

        // Ketuk Otomatis via Accessibility Service Android
        btnAutoClick.addEventListener('click', () => {
            if (detectedCoordinates && window.Android && window.Android.performAutoClick) {
                window.Android.performAutoClick(detectedCoordinates.x, detectedCoordinates.y);
            }
        });

        function formatAnalysis(text) {
            if (!text) return 'Tidak ada teks analisis.';
            return text
                .replace(/\*\*([^*]+)\*\*/g, '<strong style="color: #818cf8;">$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function showLoading(msg) {
            loadingState.style.display = 'flex';
            document.getElementById('loadingText').innerText = msg;
        }

        function hideLoading() {
            loadingState.style.display = 'none';
        }

        btnCopyResult.addEventListener('click', () => {
            navigator.clipboard.writeText(resultContent.innerText);
            btnCopyResult.innerText = 'Tersalin!';
            setTimeout(() => btnCopyResult.innerText = 'Copy', 1500);
        });
    </script>
</body>
</html>
